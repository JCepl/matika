<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matika</title>
<link rel="stylesheet" href="shared/core.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a3aa7">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="Malé aplikace na procvičování matematiky – násobilka a mapa toho, co už jde samo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Matika – násobilka a mapa toho, co už umím">
<meta property="og:description" content="Malé aplikace na procvičování matematiky pro každé dítě zvlášť.">
<meta property="og:image" content="https://jcepl.github.io/matika/icons/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  main.wrap { max-width: 560px; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 2rem; margin-top: 12px; }
  .lead { color: var(--ink-2); }
  .block { margin: 0 0 16px; }
  .name-form { display: grid; gap: 12px; margin-top: 16px; }
  .name-form input { max-width: none; width: 100%; font-size: 1.3rem; padding: 14px 16px; border-radius: 14px; }
  .name-form .btn { width: 100%; }
  .me { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .meter { height: 12px; border-radius: 999px; background: var(--none); display: flex; overflow: hidden; gap: 2px; margin: 10px 0 8px; }
  .meter span { display: block; height: 100%; }
  .meter .good { background: var(--good); }
  .meter .warn { background: var(--warn); }
  .meter .bad { background: var(--bad); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; color: var(--ink-2); }
  .app { display: flex; align-items: center; gap: 16px; text-decoration: none; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; margin-bottom: 12px; min-height: 88px; }
  .app:active { background: var(--surface-2); }
  .app svg { width: 64px; height: 64px; flex: none; border-radius: 10px; background: var(--accent); padding: 4px; }
  .app h3 { margin: 0 0 2px; font-size: 1.2rem; }
  .app p { margin: 0; color: var(--ink-2); font-size: .95rem; }
  .app.soon { opacity: .55; border-style: dashed; box-shadow: none; }
  .app.soon .ico { width: 64px; height: 64px; flex: none; border-radius: 10px; background: var(--none); color: var(--on-none); display: grid; place-items: center; font-weight: 800; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin-top: 8px; }
  .row .btn { min-height: 44px; }
  .msg { color: var(--ink-2); min-height: 1.5em; }
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script src="shared/core.js"></script>
<script src="nasobilka/stats.js"></script>
<script>
(() => {
  const M = Matika;
  M.addStrings({
    cs: {
      'u.who': 'Jak se jmenuješ?',
      'u.lead': 'Napiš své jméno nebo přezdívku. Příště ho napíšeš znovu a uvidíš svoje výsledky.',
      'u.name': 'Tvoje jméno',
      'u.go': 'Jdeme na to',
      'u.hello': 'Ahoj, {name}!',
      'u.back': 'Vítej zpátky, {name}!',
      'u.auto': 'Jde samo {g} ze 100',
      'u.results': 'Moje výsledky',
      'u.notMe': 'Nejsem {name}',
      'u.apps': 'Co budeme dělat?',
      'u.linked': 'Zařízení je připojené.',
      'app.nasobilka': 'Násobilka',
      'app.nasobilka.d': 'Procvič si násobení a uvidíš, co už ti jde samo.',
      'app.more': 'Další aplikace',
      'app.more.d': 'Připravujeme.',
      'st.good': 'Jde samo', 'st.warn': 'Skoro', 'st.bad': 'Trénovat', 'st.none': 'Nevyzkoušeno',
      'u.lang': 'English',
    },
    en: {
      'u.who': 'What is your name?',
      'u.lead': 'Type your name or nickname. Next time type it again and you will see your results.',
      'u.name': 'Your name',
      'u.go': "Let's go",
      'u.hello': 'Hi, {name}!',
      'u.back': 'Welcome back, {name}!',
      'u.auto': 'Automatic: {g} of 100',
      'u.results': 'My results',
      'u.notMe': "I'm not {name}",
      'u.apps': 'What shall we do?',
      'u.linked': 'This device is connected.',
      'app.nasobilka': 'Times tables',
      'app.nasobilka.d': 'Practise multiplication and see what is already automatic.',
      'app.more': 'More apps',
      'app.more.d': 'Coming later.',
      'st.good': 'Automatic', 'st.warn': 'Almost', 'st.bad': 'Practise', 'st.none': 'Not tried',
      'u.lang': 'Čeština',
    },
  });

  const QCOL = ['#f2b705', '#2f6fd0', '#d03b3b', '#1c9a4a'];
  // the app's emblem: a 7 × 8 rectangle on a 10 × 10 lattice, split after 5
  const lattice = (a, b) => {
    let r = '';
    for (let y = 0; y < 10; y++) for (let x = 0; x < 10; x++) {
      const on = y < a && x < b;
      r += `<rect x="${x * 10 + 1}" y="${y * 10 + 1}" width="8" height="8" rx="1.8" fill="${on ? QCOL[(y >= 5 ? 2 : 0) + (x >= 5 ? 1 : 0)] : 'rgba(255,255,255,.22)'}"/>`;
    }
    return `<svg viewBox="0 0 100 100" aria-hidden="true">${r}</svg>`;
  };

  const $ = id => document.getElementById(id);
  let welcome = false;

  function render() {
    const t = M.t, me = M.current();
    document.documentElement.lang = M.lang();
    if (!me) {
      $('app').innerHTML = `
        <h1>${t('u.who')}</h1>
        <p class="lead">${t('u.lead')}</p>
        <form class="name-form" id="nameForm">
          <input type="text" id="name" maxlength="24" autocomplete="off" autocapitalize="words" enterkeyhint="go" placeholder="${t('u.name')}" aria-label="${t('u.name')}" required>
          <button class="btn primary big" type="submit">${t('u.go')}</button>
        </form>
        <div class="row"><span></span><button class="btn ghost" id="lang">${t('u.lang')}</button></div>`;
      $('nameForm').onsubmit = e => {
        e.preventDefault();
        const name = $('name').value.trim().replace(/\s+/g, ' ');
        if (!name) return;
        const known = M.profiles().find(p => p.name.toLowerCase() === name.toLowerCase());
        if (known) { M.setCurrent(known.id); welcome = true; } else M.addProfile(name);
        render();
      };
    } else {
      const sm = NasobilkaStats.summarize(M.loadFor(me.id, 'nasobilka', null));
      const c = sm?.counts;
      const kinds = ['good', 'warn', 'bad', 'none'];
      $('app').innerHTML = `
        <h1>${t(welcome ? 'u.back' : 'u.hello', { name: M.esc(me.name) })}</h1>
        ${c ? `<div class="card block">
          <div class="me"><h2 style="margin:0">${t('u.auto', { g: c.good })}</h2>
            <a class="btn" href="nasobilka/index.html#map" style="text-decoration:none">${t('u.results')}</a></div>
          <div class="meter" role="img" aria-label="${kinds.map(k => `${t('st.' + k)} ${c[k]}`).join(', ')}">
            ${['good', 'warn', 'bad'].filter(k => c[k]).map(k => `<span class="${k}" style="width:${c[k]}%"></span>`).join('')}
          </div>
          <div class="legend">${kinds.map(k => `<span><span class="sw ${k}"></span> ${t('st.' + k)} ${c[k]}</span>`).join('')}</div>
        </div>` : ''}
        <h2>${t('u.apps')}</h2>
        <a class="app" href="nasobilka/index.html">${lattice(7, 8)}<div><h3>${t('app.nasobilka')}</h3><p>${t('app.nasobilka.d')}</p></div></a>
        <div class="app soon"><span class="ico">+ − ÷</span><div><h3>${t('app.more')}</h3><p>${t('app.more.d')}</p></div></div>
        <div class="row">
          <button class="btn ghost" id="notMe">${t('u.notMe', { name: M.esc(me.name) })}</button>
          <button class="btn ghost" id="lang">${t('u.lang')}</button>
        </div>
        <p class="msg" id="msg" aria-live="polite"></p>`;
      $('notMe').onclick = () => { M.setCurrent(null); welcome = false; render(); };
    }
    $('lang').onclick = () => { M.setLang(M.lang() === 'cs' ? 'en' : 'cs'); render(); };
  }

  M.setChildMode(true);
  const linked = M.syncFromHash();
  render();
  if (linked && $('msg')) $('msg').textContent = M.t('u.linked');
  if (M.syncConfig()) M.sync().then(r => { if (r.ok) render(); });
})();
</script>
</body>
</html>
