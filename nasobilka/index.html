<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Násobilka</title>
<link rel="stylesheet" href="../shared/core.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#4a3aa7">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
<style>
  main.wrap { padding-top: 24px; }

  /* ---- start ---- */
  .start { max-width: 640px; margin: 0 auto; }
  .start h1 { font-size: 2rem; }
  .start .lead { color: var(--ink-2); }
  .start .block { margin: 22px 0; }
  .start .block h3 { margin-bottom: 10px; }
  .meter { height: 12px; border-radius: 999px; background: var(--none); display: flex; overflow: hidden; gap: 2px; margin: 8px 0 6px; }
  .meter span { display: block; height: 100%; }
  .meter .good { background: var(--good); }
  .meter .warn { background: var(--warn); }
  .meter .bad { background: var(--bad); }
  .meter-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .9rem; color: var(--ink-2); }
  .go { margin-top: 28px; }
  .adv summary { cursor: pointer; font-weight: 600; color: var(--ink-2); padding: 8px 0; }
  .adv h3 { margin-top: 8px; }

  /* ---- practice ---- */
  .practice { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
  .ptop { width: 100%; display: flex; align-items: center; gap: 12px; }
  .pbar { flex: 1; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .pbar div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s; }
  .pcount { font-size: .9rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5ch; text-align: right; }
  .problem {
    display: flex; align-items: baseline; justify-content: center; gap: .3em;
    font-size: clamp(3rem, 16vw, 5rem); font-weight: 700; font-variant-numeric: tabular-nums;
    margin: 36px 0 8px; letter-spacing: -.01em;
  }
  .problem .op, .problem .eq { color: var(--muted); font-weight: 500; }
  .answer {
    min-width: 2.3ch; text-align: center; border-bottom: 5px solid var(--line-strong);
    color: var(--accent); transition: color .15s, border-color .15s;
  }
  .answer:empty::before { content: "\00a0"; }
  .answer.ok { color: var(--good-ink); border-color: var(--good); }
  .answer.wrong { color: var(--bad-ink); border-color: var(--bad); text-decoration: line-through; text-decoration-thickness: 4px; }
  .answer.copy { border-color: var(--warn); }
  .hint { min-height: 3.2em; text-align: center; font-size: 1.15rem; color: var(--ink-2); margin: 4px 0 12px; }
  .hint strong { color: var(--ink); font-size: 1.4rem; }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 340px; }
  .keypad button {
    font: inherit; font-size: 1.9rem; font-weight: 600; height: 68px; border-radius: 16px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  .keypad button:active { background: var(--surface-2); transform: scale(.97); }
  .keypad .k-ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-size: 1.4rem; }
  .keypad .k-del { font-size: 1.5rem; color: var(--ink-2); }
  @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .shake { animation: shake .25s 2; }

  /* ---- picture: the problem as a rectangle on a 10x10 lattice ---- */
  .viz { width: min(150px, 24vh); margin: 0 auto; }
  .viz:empty { display: none; }
  .viz svg { display: block; width: 100%; height: auto; }
  .viz .e { fill: var(--line); }
  .viz .q { fill: var(--accent); }
  .viz .n { font-size: 5.5px; fill: var(--muted); opacity: .6; font-variant-numeric: tabular-nums; }
  .viz .n.on { opacity: 1; }
  .viz .v2 { stroke: var(--bg); stroke-width: 1; opacity: .55; fill: none; }
  .viz .v5 { stroke: var(--bg); stroke-width: 2; opacity: .9; fill: none; }
  .detail-viz { width: 190px; margin: 12px 0 0; }

  /* ---- pet: little dragon / snail familiar beside the problem ---- */
  .practice { position: relative; }
  .fan { position: absolute; right: 0; top: 34px; width: clamp(66px, 19vw, 96px); pointer-events: none; animation: fanidle 2.6s ease-in-out infinite; }
  .fan[data-pet="none"] { display: none; }
  .fan svg { display: none; width: 100%; overflow: visible; }
  .fan[data-pet="dragon"] .dragon, .fan[data-pet="snail"] .snail { display: block; }
  .fan .m { display: none; }
  .fan .smile { display: inline; }
  .fan .fire { opacity: 0; }
  .fan .wing.l { transform-origin: 38px 58px; }
  .fan .wing.r { transform-origin: 62px 58px; }
  .fan .stalk.l { transform-origin: 17px 66px; }
  .fan .stalk.r { transform-origin: 27px 66px; }
  .fan .shell { transform-origin: 64px 84px; }
  @keyframes fanidle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes fanjump { 0%, 100% { transform: translateY(0) scale(1, 1); } 20% { transform: translateY(0) scale(1.08, .92); } 50% { transform: translateY(-16px) scale(.95, 1.06); } 80% { transform: translateY(0) scale(1.05, .95); } }
  @keyframes fanoops { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 60% { transform: rotate(5deg); } }
  .fan.cheer { animation: fanjump .8s ease-out; }
  .fan.big { animation: fanjump 1s ease-out; }
  .fan.oops { animation: fanoops .9s ease-in-out; }
  .fan.cheer .smile, .fan.big .smile, .fan.oops .smile { display: none; }
  .fan.cheer .open, .fan.big .open { display: inline; }
  .fan.oops .flat { display: inline; }
  /* dragon: wings flap, fire puff on a big cheer, wings droop on a mistake */
  .fan.cheer .wing.l, .fan.big .wing.l { animation: flapl .26s ease-in-out 3; }
  .fan.cheer .wing.r, .fan.big .wing.r { animation: flapr .26s ease-in-out 3; }
  .fan.big .wing { animation-iteration-count: 4; }
  .fan.big .fire { animation: puff 1s ease-out; }
  .fan.oops .wing.l { transform: rotate(-35deg) translateY(6px); } .fan.oops .wing.r { transform: rotate(35deg) translateY(6px); }
  @keyframes flapl { 0%, 100% { transform: rotate(8deg); } 50% { transform: rotate(-30deg); } }
  @keyframes flapr { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(30deg); } }
  @keyframes puff { 0% { opacity: 0; transform: scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3) translateX(6px); } }
  .fan .fire circle { transform-box: fill-box; transform-origin: left center; }
  /* snail: eye stalks wiggle, shell wobbles; stalks droop on a mistake */
  .fan.cheer .stalk.l, .fan.big .stalk.l { animation: wigl .3s ease-in-out 3; }
  .fan.cheer .stalk.r, .fan.big .stalk.r { animation: wigr .3s ease-in-out 3; }
  .fan.big .stalk { animation-iteration-count: 4; }
  .fan.cheer .shell, .fan.big .shell { animation: wobble .4s ease-in-out 2; }
  .fan.oops .stalk.l { transform: rotate(-55deg); } .fan.oops .stalk.r { transform: rotate(55deg); }
  @keyframes wigl { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(14deg); } }
  @keyframes wigr { 0%, 100% { transform: rotate(12deg); } 50% { transform: rotate(-14deg); } }
  @keyframes wobble { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-9deg); } }
  @media (prefers-reduced-motion: reduce) { .fan, .fan * { animation: none !important; } }
  .pets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }

  /* ---- feedback: stars on a quick correct answer, faint red tint on a mistake ---- */
  .fx-stars { position: fixed; left: 50%; top: 38%; z-index: 20; pointer-events: none; }
  .fx-stars span { position: absolute; font-size: 1.8rem; opacity: 0; animation: star .9s ease-out var(--d) forwards; }
  @keyframes star { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2) rotate(40deg); } }
  .fx-red { position: fixed; inset: 0; z-index: 20; pointer-events: none; background: radial-gradient(circle, rgba(220, 40, 40, 0) 40%, rgba(220, 40, 40, .22) 100%); animation: redfade .9s ease-out forwards; }
  @keyframes redfade { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }

  /* ---- summary ---- */
  .summary { max-width: 640px; margin: 0 auto; }
  .summary .score { font-size: 1.3rem; }
  .fact-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 20px; }
  .fact { padding: 4px 12px; border-radius: 999px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .fact.good { background: var(--good); color: var(--on-good); }
  .fact.bad { background: var(--bad); color: var(--on-bad); }

  /* ---- map ---- */
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  .tile { padding: 14px 16px; }
  .tile .v { font-size: 1.9rem; font-weight: 700; line-height: 1.1; }
  .tile .l { font-size: .9rem; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .map-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  .hm { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 3px; }
  .hm .h { display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--ink-2); font-size: .95rem; }
  .hm .corner { color: var(--muted); font-weight: 500; }
  .cell {
    aspect-ratio: 1; border: 0; border-radius: 6px; padding: 0; cursor: pointer;
    font: inherit; font-size: clamp(.62rem, 1.6vw, .85rem); font-weight: 600; font-variant-numeric: tabular-nums;
    position: relative; touch-action: manipulation;
  }
  .cell.good { background: var(--good); color: var(--on-good); }
  .cell.warn { background: var(--warn); color: var(--on-warn); }
  .cell.bad { background: var(--bad); color: var(--on-bad); }
  .cell.none { background: var(--none); color: var(--on-none); }
  /* only one attempt so far: hatched, to be confirmed */
  .cell.prov { background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(255, 255, 255, .3) 5px 7px); }
  .cell.sel { outline: 3px solid var(--ink); outline-offset: 1px; z-index: 1; }
  .cell:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; z-index: 2; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; color: var(--ink-2); margin: 12px 0 0; }
  .legend .sw.prov { background: var(--good) repeating-linear-gradient(45deg, transparent 0 3px, rgba(255, 255, 255, .5) 3px 5px); }
  .axis-note { font-size: .85rem; color: var(--muted); margin-top: 8px; }

  .detail h3 { font-size: 1.6rem; font-variant-numeric: tabular-nums; margin-bottom: 6px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .95rem; }
  .detail table { width: 100%; border-collapse: collapse; font-size: .95rem; margin: 10px 0 14px; font-variant-numeric: tabular-nums; }
  .detail th { text-align: left; font-weight: 600; color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; border-bottom: 1px solid var(--line); }
  .detail td { padding: 6px; border-bottom: 1px solid var(--line); }
  .detail td.ok { color: var(--good-ink); font-weight: 700; }
  .detail td.no { color: var(--bad-ink); font-weight: 700; }
  .detail .kv { margin: 4px 0; color: var(--ink-2); }
  .detail .kv b { color: var(--ink); }

  .tip {
    position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 8px 10px; border-radius: 8px; font-size: .85rem; line-height: 1.35; max-width: 220px;
    font-variant-numeric: tabular-nums;
  }

  .history { margin-top: 20px; }
  .history svg { width: 100%; height: auto; display: block; overflow: visible; }
  .history .grid-line { stroke: var(--line); stroke-width: 1; }
  .history .axis-t { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .history .seg-good { fill: var(--good); }
  .history .seg-warn { fill: var(--warn); }
  .history .seg-bad { fill: var(--bad); }
  .history .seg-none { fill: var(--none); }
  .history .hit { fill: transparent; cursor: default; }
  .history .hit:hover { fill: var(--ink); fill-opacity: .06; }
  .rules { margin-top: 20px; }
  .rules ul { margin: 0; padding-left: 1.2em; color: var(--ink-2); }
  .rules li { margin: 4px 0; }

  /* ---- settings ---- */
  .settings { max-width: 640px; margin: 0 auto; }
  .settings .card { margin-bottom: 16px; }
  .inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  @media (max-width: 760px) {
    .map-grid { grid-template-columns: 1fr; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .hm { gap: 2px; }
    .problem { margin-top: 24px; }
  }
</style>
</head>
<body>
<header class="topbar" id="topbar">
  <a class="back" href="../index.html" data-i18n="back"></a>
  <span class="who" id="who"></span>
  <nav class="tabs" role="tablist">
    <button role="tab" data-view="start" data-i18n="tab.practice"></button>
    <button role="tab" data-view="map" data-i18n="tab.map"></button>
    <button role="tab" data-view="settings" data-i18n="tab.settings"></button>
  </nav>
</header>

<main class="wrap">
  <section class="view start" id="view-start" hidden></section>

  <section class="view practice" id="view-practice" hidden>
    <div class="ptop">
      <div class="pbar"><div id="pfill"></div></div>
      <span class="pcount" id="pcount"></span>
      <button class="btn ghost" id="quit" data-i18n="practice.quit"></button>
    </div>
    <div class="problem" aria-live="polite">
      <span id="qa"></span><span class="op" id="op"></span><span id="qb"></span><span class="eq">=</span><span class="answer" id="answer"></span>
    </div>
    <div class="fan" id="fan" data-pet="dragon" aria-hidden="true">
      <svg class="pet dragon" viewBox="0 0 100 100">
        <path d="M70 84Q94 86 92 62" stroke="#4cae78" stroke-width="9" fill="none" stroke-linecap="round"/>
        <path d="M88 56l8 10-12 2z" fill="#f4b73e"/>
        <path class="wing l" d="M34 60Q8 46 12 26Q26 36 42 50Z" fill="#8bd9a8"/>
        <path class="wing r" d="M66 60Q92 46 88 26Q74 36 58 50Z" fill="#8bd9a8"/>
        <ellipse cx="38" cy="92" rx="9" ry="5" fill="#3d9a66"/><ellipse cx="62" cy="92" rx="9" ry="5" fill="#3d9a66"/>
        <ellipse cx="50" cy="70" rx="24" ry="22" fill="#4cae78"/><ellipse cx="50" cy="76" rx="14" ry="14" fill="#f2e3a4"/>
        <g class="head">
          <path d="M35 28L30 10l14 12z" fill="#f4b73e"/><path d="M65 28L70 10L56 22z" fill="#f4b73e"/>
          <circle cx="50" cy="42" r="21" fill="#4cae78"/>
          <circle cx="41" cy="39" r="5" fill="#fff"/><circle cx="59" cy="39" r="5" fill="#fff"/>
          <circle cx="42" cy="40" r="2.5" fill="#25323a"/><circle cx="58" cy="40" r="2.5" fill="#25323a"/>
          <circle cx="33" cy="49" r="4" fill="#ff9dbf" opacity=".6"/><circle cx="67" cy="49" r="4" fill="#ff9dbf" opacity=".6"/>
          <path class="m smile" d="M43 50q7 6 14 0" stroke="#25323a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <path class="m open" d="M42 49q8 13 16 0z" fill="#7a2e3a"/>
          <path class="m flat" d="M44 53q6-2.5 12 0" stroke="#25323a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </g>
        <g class="fire"><circle cx="72" cy="52" r="6" fill="#f4813e"/><circle cx="82" cy="49" r="4" fill="#ffd978"/><circle cx="64" cy="54" r="3.5" fill="#ffd978"/></g>
      </svg>
      <svg class="pet snail" viewBox="0 0 100 100">
        <path d="M6 90Q6 78 22 78H84Q97 80 95 90Q93 94 84 94H14Q6 94 6 90Z" fill="#8fd18c"/>
        <ellipse cx="22" cy="74" rx="13" ry="15" fill="#8fd18c"/>
        <g class="stalk l"><path d="M17 66L12 44" stroke="#8fd18c" stroke-width="5" stroke-linecap="round"/><circle cx="12" cy="40" r="6" fill="#fff" stroke="#8fd18c" stroke-width="1.5"/><circle cx="12.5" cy="40.5" r="2.7" fill="#25323a"/></g>
        <g class="stalk r"><path d="M27 66L33 44" stroke="#8fd18c" stroke-width="5" stroke-linecap="round"/><circle cx="33" cy="40" r="6" fill="#fff" stroke="#8fd18c" stroke-width="1.5"/><circle cx="33.5" cy="40.5" r="2.7" fill="#25323a"/></g>
        <g class="shell"><circle cx="64" cy="58" r="27" fill="#e8933a"/>
          <path d="M60 58m0 0a4 4 0 1 1 8 0a9 9 0 1 1-18 0a15 15 0 1 1 30 0a21 21 0 1 1-42 0" transform="translate(4 0)" stroke="#b8641a" stroke-width="3" fill="none" stroke-linecap="round"/></g>
        <circle cx="16" cy="80" r="3" fill="#ff9dbf" opacity=".6"/>
        <path class="m smile" d="M18 80q5 5 10 0" stroke="#25323a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path class="m open" d="M18 79q5 10 10 0z" fill="#7a2e3a"/>
        <path class="m flat" d="M19 83q4-2 8 0" stroke="#25323a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="viz" id="viz"></div>
    <p class="hint" id="hint"></p>
    <div class="keypad" id="keypad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="k-del" aria-label="⌫">⌫</button><button data-k="0">0</button><button data-k="ok" class="k-ok">OK</button>
    </div>
  </section>

  <section class="view summary" id="view-summary" hidden></section>
  <section class="view" id="view-map" hidden></section>
  <section class="view settings" id="view-settings" hidden></section>
</main>

<div class="tip" id="tip" hidden></div>

<script src="../shared/core.js"></script>
<script src="stats.js"></script>
<script src="nasobilka.js"></script>
</body>
</html>
